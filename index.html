<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BT Script Builder Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
    <script type="module">
        import { Application, Assets, Sprite, AddColorMatrixFilter, AdvancedBloomFilter } from 'https://cdn.skypack.dev/pixi.js';

        (async () =>
        {
            // Create a new application
            const app = new Application();

            // Initialize the application
            await app.init({ resizeTo: window });

            // Append the application canvas to the document body
            document.body.appendChild(app.canvas);
            app.canvas.style.position = 'fixed';
            app.canvas.style.top = '0';
            app.canvas.style.left = '0';
            app.canvas.style.zIndex = '-1';
            app.canvas.style.opacity = '0.6'; // Немного затемним фон для читаемости

            // Load the texture
            const texture = await Assets.load('https://pixijs.com/assets/bg_scene_rotate.jpg');

            // Create color filters
            const colorMatrix = new AddColorMatrixFilter();
            colorMatrix.desaturate();
            colorMatrix.contrast(1.5, false);
            colorMatrix.brightness(0.8, false);

            const colorMatrix2 = new AddColorMatrixFilter();
            colorMatrix2.lsd(true); // Киберпанк эффект

            const bloom = new AdvancedBloomFilter({ threshold: 0.1, bloomScale: 1.5, blur: 8, quality: 10 });

            // Create sprites
            const bgFront = new Sprite(texture);
            const bgBack = new Sprite(texture);

            // Configure sprites
            bgBack.anchor.set(0.5);
            bgFront.anchor.set(0.5);
            bgBack.filters = [colorMatrix, colorMatrix2, bloom];
            bgFront.filters = [colorMatrix, colorMatrix2, bloom];

            // Set sizes and positions
            const container = app.stage;
            container.addChild(bgBack, bgFront);

            function resize() {
                const width = app.screen.width;
                const height = app.screen.height;
                const scale = Math.max(width / texture.width, height / texture.height) * 1.2;

                bgBack.scale.set(scale);
                bgFront.scale.set(scale);
                bgBack.position.set(width / 2, height / 2);
                bgFront.position.set(width / 2, height / 2);
            }
            resize();
            window.addEventListener('resize', resize);

            // Animation variables
            let tick = 0;
            // Make app globally accessible for the toggle switch
            window.pixiApp = app;

            // Animate
            app.ticker.add(() =>
            {
                tick += 0.005;
                bgFront.rotation += -0.002;
                bgBack.rotation -= 0.001;
                bgBack.alpha = 0.5 + Math.cos(tick) * 0.5;
            });
        })();
    </script>

    <div class="app-container">
        <header>
            <div class="header-content">
                 <h1>BT Script Builder <span class="cyber-glitch">Mobile</span></h1>
                 <div class="header-controls">
                    <label class="toggle-switch">
                        <input type="checkbox" id="anim-toggle" checked>
                        <span class="toggle-slider">Anim</span>
                    </label>
                    <button id="reset-btn" class="cyber-button danger small">СБРОС</button>
                 </div>
            </div>
        </header>

        <main>
            <div class="toolbar-container custom-scrollbar">
                <div class="toolbar">
                    <button class="cmd-btn" data-type="STRING">STRING</button>
                    <button class="cmd-btn" data-type="DELAY">DELAY</button>
                    <button class="cmd-btn key-btn" data-type="ENTER">ENTER</button>

                    <button class="cmd-btn mod-btn" data-type="GUI">GUI ⌘</button>
                    <button class="cmd-btn mod-btn" data-type="CTRL">CTRL</button>
                    <button class="cmd-btn mod-btn" data-type="ALT">ALT</button>
                    <button class="cmd-btn mod-btn" data-type="SHIFT">SHIFT</button>

                    <button class="cmd-btn key-btn" data-type="TAB">TAB</button>
                    <button class="cmd-btn key-btn" data-type="ESC">ESC</button>
                    <button class="cmd-btn key-btn" data-type="BACKSPACE">BKSP</button>
                    <button class="cmd-btn key-btn" data-type="DELETE">DEL</button>

                    <button class="cmd-btn arrow-btn" data-type="UPARROW">↑</button>
                    <button class="cmd-btn arrow-btn" data-type="DOWNARROW">↓</button>
                    <button class="cmd-btn arrow-btn" data-type="LEFTARROW">←</button>
                    <button class="cmd-btn arrow-btn" data-type="RIGHTARROW">→</button>
                    
                    <button class="cmd-btn f-btn" data-type="F1">F1</button>
                    <button class="cmd-btn f-btn" data-type="F2">F2</button>
                    <button class="cmd-btn f-btn" data-type="F5">F5</button>
                    <button class="cmd-btn f-btn" data-type="F11">F11</button>
                    <button class="cmd-btn f-btn" data-type="F12">F12</button>

                    <button class="cmd-btn media-btn" data-type="MEDIA_VOLUME_UP" title="Volume Up">VOL+</button>
                    <button class="cmd-btn media-btn" data-type="MEDIA_VOLUME_DOWN" title="Volume Down">VOL-</button>
                    <button class="cmd-btn media-btn" data-type="MEDIA_PLAY_PAUSE" title="Play/Pause">⏯</button>
                    <button class="cmd-btn media-btn" data-type="MEDIA_NEXT" title="Next Track">⏭</button>

                     <button class="cmd-btn sys-btn" data-type="CAPSLOCK">CAPS</button>
                    <button class="cmd-btn sys-btn" data-type="PRINTSCREEN">PrtSc</button>
                    <button class="cmd-btn sys-btn" data-type="SPACE">SPACE</button>

                    <button class="cmd-btn combo-btn" data-combo="GUI r">Win+R</button>
                    <button class="cmd-btn combo-btn" data-combo="CTRL c">Ctrl+C</button>
                    <button class="cmd-btn combo-btn" data-combo="CTRL v">Ctrl+V</button>
                    <button class="cmd-btn combo-btn" data-combo="ALT F4">Alt+F4</button>
                     <button class="cmd-btn combo-btn" data-combo="CTRL ALT DELETE">Ctrl+Alt+Del</button>

                </div>
            </div>

            <div class="script-area custom-scrollbar">
                <div id="command-list" class="command-list">
                    <div class="empty-placeholder">Нажмите на кнопки выше, чтобы добавить команды</div>
                </div>
            </div>
        </main>

        <footer>
             <div class="export-options">
                 <div class="format-select-group">
                    <label for="export-format">Формат:</label>
                    <select id="export-format" class="cyber-select">
                        <option value="ducky">DuckyScript (.txt)</option>
                        <option value="flipper">Flipper Zero (.sub)</option>
                        <option value="esp32">Arduino ESP32 (.ino)</option>
                    </select>
                 </div>
                 <div class="template-select-group">
                     <select id="quick-template" class="cyber-select">
                         <option value="">Быстрые шаблоны...</option>
                         <option value="win_cmd">Windows CMD (Админ)</option>
                         <option value="win_ps">Windows PowerShell</option>
                         <option value="mac_term">macOS Terminal</option>
                         <option value="android_browser">Android Browser</option>
                     </select>
                 </div>
             </div>
             <div class="action-buttons">
                 <button id="generate-btn" class="cyber-button primary">Сгенерировать</button>
             </div>
        </footer>

        <div id="result-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Результат (<span id="result-format-name"></span>)</h2>
                <textarea id="result-output" class="cyber-textarea custom-scrollbar" readonly></textarea>
                <div class="modal-actions">
                    <button id="copy-btn" class="cyber-button">Копировать</button>
                    <button id="download-btn" class="cyber-button alt-action">Скачать файл</button>
                </div>
            </div>
        </div>

        <div id="edit-modal" class="modal">
            <div class="modal-content small-modal">
                <h2 id="edit-modal-title">Редактировать</h2>
                <input type="text" id="edit-input" class="cyber-input">
                <div class="modal-actions">
                    <button id="save-edit-btn" class="cyber-button primary">ОК</button>
                    <button id="cancel-edit-btn" class="cyber-button">Отмена</button>
                </div>
            </div>
        </div>

         <style>
            /* Стиль для переключателя анимации */
            .toggle-switch {
                position: relative;
                display: inline-block;
                margin-right: 10px;
                cursor: pointer;
                font-size: 0.8rem;
                color: var(--cyber-text-secondary, #8892b0);
            }
            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .toggle-slider {
                border: 1px solid var(--cyber-border, #3a4b61);
                padding: 4px 8px;
                background: rgba(10, 25, 47, 0.6);
                transition: .4s;
            }
            .toggle-switch input:checked + .toggle-slider {
                background: var(--cyber-primary, #64ffda);
                color: var(--cyber-bg, #0a192f);
                box-shadow: 0 0 10px var(--cyber-primary-glow, rgba(100, 255, 218, 0.3));
            }
            
            /* Стиль для кнопок медиа */
            .media-btn {
                border-color: #e67e22 !important; /* Оранжевый оттенок */
                color: #e67e22 !important;
            }
            .media-btn:active {
                 background: rgba(230, 126, 34, 0.2) !important;
                 box-shadow: 0 0 15px rgba(230, 126, 34, 0.5) !important;
            }

            /* Стиль для альтернативной кнопки действия (Скачать) */
            .cyber-button.alt-action {
                border-color: var(--cyber-text-secondary, #8892b0);
                color: var(--cyber-text-secondary, #8892b0);
            }
            .cyber-button.alt-action:active {
                 background: rgba(136, 146, 176, 0.2);
                 color: var(--cyber-text, #e6f1ff);
            }
            /* Убираем дефолтное выделение при тапе на мобилках */
            * {
                -webkit-tap-highlight-color: transparent;
            }
            /* Улучшаем хват для сортировки */
            .command-item {
                touch-action: manipulation; /* Важно для мобилок */
            }
            .drag-handle {
                cursor: grab;
                padding: 0 10px;
                font-size: 1.2rem;
                color: var(--cyber-text-secondary, #8892b0);
            }
            /* Стили для SortableJS */
            .sortable-ghost {
                opacity: 0.4;
                background-color: var(--cyber-primary, #64ffda) !important;
            }
            .sortable-chosen {
                 box-shadow: 0 0 15px var(--cyber-primary-glow, rgba(100, 255, 218, 0.3)) !important;
            }
         </style>
    </div>
    <script src="main.js"></script>
</body>
</html>
