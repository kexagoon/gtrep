<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Эволюция существ</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        #ui label {
            display: block;
            margin-top: 5px;
        }
        #ui input {
            width: 60px;
        }
    </style>
</head>
<body>
    <canvas id="simulation"></canvas>
    <div id="ui">
        <div><b>Настройки:</b></div>
        <label>Стартовые существа: <input type="number" id="startCount" value="60"></label>
        <label>Макс. существа: <input type="number" id="maxCreatures" value="150"></label>
        <label>Шанс мутации: <input type="number" id="mutationChance" value="0.1" step="0.01"></label>
        <label>Кол-во еды: <input type="number" id="maxFood" value="50"></label>
        <label>Размер: <input type="number" id="radius" value="5"></label>
        <button onclick="restartSimulation()">Перезапустить</button>
        <div id="stats" style="margin-top:10px;"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
