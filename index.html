<!DOCTYPE html>
<html>
<head>
    <title>Triple Ball Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: Arial;
        }
        .ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 15px currentColor;
            cursor: pointer;
            z-index: 10;
        }
        #red-ball {
            background: red;
            color: red;
        }
        #green-ball {
            background: green;
            color: green;
        }
        #blue-ball {
            background: blue;
            color: blue;
        }
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        .smiley {
            position: absolute;
            font-size: 30px;
            z-index: 20;
            cursor: pointer;
            text-shadow: 0 0 10px yellow;
            transition: transform 0.3s;
        }
        #score-display {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="score-display">Шарики: 3 | Смайлики: 0</div>
    <div id="red-ball" class="ball"></div>
    <div id="green-ball" class="ball"></div>
    <div id="blue-ball" class="ball"></div>
    <script src="game.js"></script>
</body>
</html>
