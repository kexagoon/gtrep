<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Эволюция существ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f9f9f4; /* светлый тёплый фон */
      color: #111;
      font-family: sans-serif;
      overflow: hidden;
    }
    canvas { display: block; }
    #open-settings {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      color: #222;
      z-index: 20;
    }
    #settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      box-sizing: border-box;
      overflow-y: auto;
      display: none;
      z-index: 15;
      color: #000;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tab-button {
      flex: 1;
      padding: 8px;
      text-align: center;
      background: #eeeeee;
      border: 1px solid #cccccc;
      cursor: pointer;
      font-size: 13px;
      color: #000;
    }
    .tab-button.active { background: #dddddd; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .group { margin-bottom: 15px; }
    .group label { display: block; margin: 5px 0; }
    input[type="number"], input[type="checkbox"] {
      width: 60px; margin-left: 5px;
    }
    button {
      margin-top: 10px;
      padding: 6px 10px;
      background: #dddddd;
      border: none;
      color: #000;
      border-radius: 4px;
      cursor: pointer;
    }
    .dot {
      display:inline-block;
      width:12px;
      height:12px;
      border-radius:50%;
      margin-right:5px;
    }
  </style>
</head>
<body>
<canvas id="simulation"></canvas>
<div id="open-settings">⚙ Настройки</div>
<div id="settings-panel">
  <!-- всё остальное (вкладки, параметры, статистика и т.д.) оставляешь как в предыдущем варианте -->
</div>
<script>
  function toggleSettings() {
    const panel = document.getElementById("settings-panel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
  }
  document.getElementById("open-settings").addEventListener("click", toggleSettings);
  document.querySelectorAll(".tab-button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });
</script>
<script src="main.js"></script>
</body>
</html>
