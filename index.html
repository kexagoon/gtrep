<!DOCTYPE html>
<html>
<head>
    <title>Random Walker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
        }
        #character {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px red;
        }
        #counter {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="counter">Steps: 0</div>
    <div id="character"></div>
    <script src="game.js"></script>
</body>
</html>
